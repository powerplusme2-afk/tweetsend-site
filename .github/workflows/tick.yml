# The bot's heartbeat: one tick on the live site every 5 minutes (GitHub's
# smallest cron step, often a few minutes late). Nothing runs here except a
# curl; the work happens in /api/tick on Vercel with the keys that live there.
# TICK_TOKEN is a random string made for this — not one of the client's keys.
name: bot tick
on:
  schedule:
    - cron: '2-59/5 * * * *'
  workflow_dispatch:
    inputs:
      dry:
        description: 'dry run (post nothing)'
        default: 'false'
      since:
        description: 'rewind: re-read mentions after this tweet id (dry runs only)'
        default: ''
jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: tick
        run: |
          Q=""; [ "${{ github.event.inputs.dry }}" = "true" ] && Q="?dry=1"
          [ -n "$Q" ] && [ -n "${{ github.event.inputs.since }}" ] && Q="$Q&since=${{ github.event.inputs.since }}"
          curl -sS -f -H "authorization: Bearer ${{ secrets.TICK_TOKEN }}" "https://tweetsend.com/api/tick$Q"
